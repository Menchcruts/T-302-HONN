version: '3.8'

services:
  order-service:
    build: 
      context: ./OrderService
      dockerfile: Dockerfile
    
    container_name: order-service

    profiles:
      - orders
      - core

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      - POSTGRES_DB=${POSTGRES_ORDERS_DB}
      - POSTGRES_USER=${POSTGRES_ORDERS_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ORDERS_PASS}
      
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}

      - MERCHANT_SERVICE_BASE_URL=${MERCHANT_SERVICE_BASE_URL}
      - BUYER_SERVICE_BASE_URL=${BUYER_SERVICE_BASE_URL}
      - INVENTORY_SERVICE_BASE_URL=${INVENTORY_SERVICE_BASE_URL}

      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - ORDER_EVENTS_EXCHANGE=orders.events
      - ORDER_CREATED_ROUTING_KEY=order.created

    ports:
      - "${ORDERS_PORT}:${ORDERS_PORT}"

    restart: "unless-stopped"
    command: [
      "python", "-m", "uvicorn",
      "startup:app",
      "--host", "0.0.0.0",
      "--port", "${ORDERS_PORT}"
    ]

  merchant-service:
    build:
      context: ./MerchantService
      dockerfile: Dockerfile
      
    container_name: merchant-service

    profiles:
      - merchant
      - core

    depends_on:
      postgres:
        condition: service_healthy
        
    environment:
      - POSTGRES_DB=${POSTGRES_MERCHANTS_DB}
      - POSTGRES_USER=${POSTGRES_MERCHANTS_USER}
      - POSTGRES_PASSWORD=${POSTGRES_MERCHANTS_PASS}

      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}

    ports:
      - "${MERCHANTS_PORT}:${MERCHANTS_PORT}"

    restart: "unless-stopped"
    command: [
      "python", "-m", "uvicorn",
      "startup:app",
      "--host", "0.0.0.0",
      "--port", "${MERCHANTS_PORT}"
    ]

  buyer-service:
    build:
      context: ./BuyerService
      dockerfile: Dockerfile
      
    container_name: buyer-service

    profiles:
      - buyer
      - core

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - POSTGRES_DB=${POSTGRES_BUYERS_DB}
      - POSTGRES_USER=${POSTGRES_BUYERS_USER}
      - POSTGRES_PASSWORD=${POSTGRES_BUYERS_PASS}

      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}

    ports:
      - "${BUYERS_PORT}:${BUYERS_PORT}"

    restart: "unless-stopped"
    command: [
      "python", "-m", "uvicorn",
      "startup:app",
      "--host", "0.0.0.0",
      "--port", "${BUYERS_PORT}"
    ]

  inventory-service:
    build:
      context: ./InventoryService
      dockerfile: Dockerfile
      
    container_name: inventory-service

    profiles:
      - inventory
      - core

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - POSTGRES_DB=${POSTGRES_INVENTORY_DB}
      - POSTGRES_USER=${POSTGRES_INVENTORY_USER}
      - POSTGRES_PASSWORD=${POSTGRES_INVENTORY_PASS}

      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}

    ports:
      - "${INVENTORY_PORT}:${INVENTORY_PORT}"

    restart: "unless-stopped"
    command: [
      "python", "-m", "uvicorn",
      "startup:app",
      "--host", "0.0.0.0",
      "--port", "${INVENTORY_PORT}"
    ]

  payment-service:
    build:
      context: ./PaymentService
      dockerfile: Dockerfile
      
    container_name: payment-service

    profiles:
      - payment

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - POSTGRES_DB=${POSTGRES_PAYMENTS_DB}
      - POSTGRES_USER=${POSTGRES_PAYMENTS_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PAYMENTS_PASS}

      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}

    ports:
      - "${PAYMENTS_PORT}:8000"

    restart: "unless-stopped"
    command: [
      "python", "-m", "uvicorn",
      "startup:app",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]

  email-service:
    build:
      context: ./EmailService
      dockerfile: Dockerfile
      
    container_name: email-service

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
      
    container_name: api-gateway


  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: project-2-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES="${POSTGRES_ORDERS_DB},${POSTGRES_ORDERS_USER}:${POSTGRES_MERCHANTS_DB},${POSTGRES_MERCHANTS_USER}:${POSTGRES_BUYERS_DB},${POSTGRES_BUYERS_USER}:${POSTGRES_INVENTORY_DB},${POSTGRES_INVENTORY_USER}:${POSTGRES_PAYMENTS_DB},${POSTGRES_PAYMENTS_USER}"

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    volumes:
      - project-2_postgres_data:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d

    restart: unless-stopped

volumes:
  project-2_postgres_data:

networks:
  default:
    driver: bridge
    name: project-2-network
