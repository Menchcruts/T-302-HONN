version: "3.8"

services:
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notflix-migrations
    volumes:
      - sqlite_data:/app/sqlite_data
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notflix-api
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/sqlite_data
    command: ["python", "-m", "uvicorn", "startup:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

volumes:
  sqlite_data:
