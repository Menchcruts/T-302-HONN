version: "3.8"
services:
  merchant-service:
    build:
      context: ./MerchantService
      dockerfile: Dockerfile
      
    container_name: merchant-service
    environment:
    - POSTGRES_DB=project2_db
    - POSTGRES_USER=admin
    - POSTGRES_PASSWORD=admin
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    
    ports:
      - "8001:8001"

  postgres:
    image: postgres:latest
    container_name: project-2
    environment:
      POSTGRES_DB: project2_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - project_2_volume:/var/lib/postgresql

    restart: unless-stopped

volumes:
  project_2_volume:

networks:
  default:
    driver: bridge
    name: project-2-network